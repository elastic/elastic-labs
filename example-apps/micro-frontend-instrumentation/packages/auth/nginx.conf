server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    add_header Access-Control-Allow-Origin * always;
    try_files $uri $uri/ /index.html;
  }

  location = /remoteEntry.js {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=60";
    try_files $uri =404;
  }
}