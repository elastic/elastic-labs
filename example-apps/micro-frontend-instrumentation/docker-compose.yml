services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      JWT_SECRET: dev-docker-compose-secret
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003
    ports:
      - "4000:4000"

  auth:
    build:
      context: .
      dockerfile: docker/Dockerfile.auth
      args:
        PUBLIC_PATH: http://localhost:3001/
        AUTH_API_URL: http://localhost:4000
    ports:
      - "3001:80"

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
      args:
        PUBLIC_PATH: http://localhost:3002/
    ports:
      - "3002:80"

  photo:
    build:
      context: .
      dockerfile: docker/Dockerfile.photo
      args:
        PUBLIC_PATH: http://localhost:3003/
    ports:
      - "3003:80"

  shell:
    build:
      context: .
      dockerfile: docker/Dockerfile.shell
      args:
        PUBLIC_PATH: http://localhost:3000/
        AUTH_REMOTE_URL: http://localhost:3001/remoteEntry.js
        DASHBOARD_REMOTE_URL: http://localhost:3002/remoteEntry.js
        PHOTO_REMOTE_URL: http://localhost:3003/remoteEntry.js
    ports:
      - "3000:80"
    depends_on:
      - api
      - auth
      - dashboard
      - photo