apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: custom-scc-limit-ipc-namespace
  namespace: openshift-compliance
spec:
  id: xccdf_org.ssgproject.content_rule_scc_limit_ipc_namespace
  title: "Minimize the admission of containers sharing the host IPC namespace"
  severity: medium
  checkType: Platform
  scannerType: CEL
  expression: |
    sccs.items.all(s,
      s.metadata.name == "privileged" ||
      !has(s.allowHostIPC) ||
      s.allowHostIPC == false
    )
  failureReason: "A non-default SCC allows sharing the host IPC namespace"
  inputs:
    - name: sccs
      kubernetesInputSpec:
