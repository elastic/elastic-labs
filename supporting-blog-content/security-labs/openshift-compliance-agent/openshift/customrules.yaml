apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: custom-rbac-least-privilege
  namespace: openshift-compliance
spec:
  id: xccdf_org.ssgproject.content_rule_rbac_least_privilege
  title: "Ensure only required privilege is assigned to accounts"
  severity: high
  checkType: Platform
  scannerType: CEL
  expression: |
    clusterrolebindings.items.all(crb,
      crb.roleRef.name.startsWith("system:") ||
      !clusterroles.items.exists(cr,
        cr.metadata.name == crb.roleRef.name &&
        cr.rules.exists(r, ("*" in r.resources) || ("*" in r.verbs) || ("*" in r.apiGroups))
      )
    )
  failureReason: "A non-system ClusterRoleBinding grants a ClusterRole containing a wildcard rule"
  inputs:
    - name: clusterrolebindings
      kubernetesInputSpec:
        apiVersion: rbac.authorization.k8s.io/v1
        resource: clusterrolebindings
    - name: clusterroles
      kubernetesInputSpec:
        apiVersion: rbac.authorization.k8s.io/v1
        resource: clusterroles
---
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: custom-rbac-wildcard-use
  namespace: openshift-compliance
spec:
  id: xccdf_org.ssgproject.content_rule_rbac_wildcard_use
  title: "Minimize wildcard use in Roles and ClusterRoles"
  severity: medium
  checkType: Platform
  scannerType: CEL
  expression: |
    clusterroles.items.all(cr,
      cr.metadata.name.startsWith("system:") ||
      !cr.rules.exists(r,
        ("*" in r.resources) || ("*" in r.verbs) || ("*" in r.apiGroups)
      )
    )
  failureReason: "A non-system ClusterRole uses a wildcard in resources, verbs, or apiGroups"
  inputs:
    - name: clusterroles
      kubernetesInputSpec:
        apiVersion: rbac.authorization.k8s.io/v1
        resource: clusterroles
---
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: custom-rbac-limit-cluster-admin
  namespace: openshift-compliance
spec:
  id: xccdf_org.ssgproject.content_rule_rbac_limit_cluster_admin
  title: "Minimize access to the cluster-admin role"
  severity: medium
  checkType: Platform
  scannerType: CEL
  expression: |
    clusterrolebindings.items.all(crb,
      crb.roleRef.name != "cluster-admin" ||
      (has(crb.subjects) && crb.subjects.all(s, s.name.startsWith("system:")))
    )
  failureReason: "A non-system subject is bound to cluster-admin"
  inputs:
    - name: clusterrolebindings
      kubernetesInputSpec:
        apiVersion: rbac.authorization.k8s.io/v1
        resource: clusterrolebindings
---
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: custom-rbac-limit-secrets-access
  namespace: openshift-compliance
spec:
  id: xccdf_org.ssgproject.content_rule_rbac_limit_secrets_access
  title: "Minimize access to secrets"
  severity: medium
  checkType: Platform
  scannerType: CEL
  expression: |
    clusterroles.items.all(cr,
      cr.metadata.name.startsWith("system:") ||
      !cr.rules.exists(r,
        has(r.resources) && "secrets" in r.resources &&
        has(r.verbs) && r.verbs.exists(v, v in ["get","list","watch"])
      )
    )
  failureReason: "A non-system ClusterRole grants read access to secrets"
  inputs:
    - name: clusterroles
      kubernetesInputSpec:
        apiVersion: rbac.authorization.k8s.io/v1
        resource: clusterroles
---
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: custom-rbac-pod-creation-access
  namespace: openshift-compliance
spec:
  id: xccdf_org.ssgproject.content_rule_rbac_pod_creation_access
  title: "Minimize access to create pods"
  severity: medium
  checkType: Platform
  scannerType: CEL
  expression: |
    clusterroles.items.all(cr,
      cr.metadata.name.startsWith("system:") ||
      !cr.rules.exists(r,
        has(r.resources) && "pods" in r.resources &&
        has(r.verbs) && "create" in r.verbs
      )
    )
  failureReason: "A non-system ClusterRole grants create access on pods"
  inputs:
    - name: clusterroles
      kubernetesInputSpec:
        apiVersion: rbac.authorization.k8s.io/v1
        resource: clusterroles
---
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: custom-scc-limit-root-containers
  namespace: openshift-compliance
spec:
  id: xccdf_org.ssgproject.content_rule_scc_limit_root_containers
  title: "Minimize the admission of root containers"
  severity: medium
  checkType: Platform
  scannerType: CEL
  expression: |
    sccs.items.all(s,
      s.metadata.name == "privileged" ||
      (has(s.runAsUser) && s.runAsUser.type != "RunAsAny")
    )
  failureReason: "A non-default SCC permits running as any user, including root"
  inputs:
    - name: sccs
      kubernetesInputSpec:
        apiVersion: security.openshift.io/v1
        resource: securitycontextconstraints
---
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: custom-scc-limit-privileged-containers
  namespace: openshift-compliance
spec:
  id: xccdf_org.ssgproject.content_rule_scc_limit_privileged_containers
  title: "Minimize the admission of privileged containers"
  severity: medium
  checkType: Platform
  scannerType: CEL
  expression: |
    sccs.items.all(s,
      s.metadata.name == "privileged" ||
      !has(s.allowPrivilegedContainer) ||
      s.allowPrivilegedContainer == false
    )
  failureReason: "A non-default SCC allows privileged containers"
  inputs:
    - name: sccs
      kubernetesInputSpec:
        apiVersion: security.openshift.io/v1
        resource: securitycontextconstraints
---
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: custom-scc-limit-privilege-escalation
  namespace: openshift-compliance
spec:
  id: xccdf_org.ssgproject.content_rule_scc_limit_privilege_escalation
  title: "Minimize the admission of containers with allowPrivilegeEscalation"
  severity: medium
  checkType: Platform
  scannerType: CEL
  expression: |
    sccs.items.all(s,
      s.metadata.name == "privileged" ||
      !has(s.allowPrivilegeEscalation) ||
      s.allowPrivilegeEscalation == false
    )
  failureReason: "A non-default SCC allows privilege escalation"
  inputs:
    - name: sccs
      kubernetesInputSpec:
        apiVersion: security.openshift.io/v1
        resource: securitycontextconstraints
---
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: custom-scc-limit-process-id-namespace
