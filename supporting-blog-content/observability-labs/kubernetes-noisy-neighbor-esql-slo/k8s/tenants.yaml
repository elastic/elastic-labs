# Two tenants on the same worker. Both Deployments pin to the worker with a nodeSelector so
# the scheduler cannot separate them. Labels tenant and app.kubernetes.io/name are what the
# collector extracts (values-tenant-labels.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: team-storefront
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-batch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-nginx
  namespace: team-storefront
data:
  default.conf: |
    server {
      listen 80;
      gzip on;
      gzip_comp_level 1;
      gzip_min_length 0;
      gzip_types application/octet-stream;
      location / {
        root /usr/share/nginx/html;
      }
      location /healthz {
        return 200 'ok';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: team-storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        tenant: storefront
        app.kubernetes.io/name: storefront
    spec:
      nodeSelector:
        kubernetes.io/hostname: noisy-neighbor-worker
      initContainers:
        # 8 MiB of random bytes: NGINX gzips it on every request, which is the CPU work
        # the storefront needs per request.
        - name: payload
          image: busybox:1.36
          command: ["sh", "-c", "head -c 8388608 /dev/urandom > /html/export.bin"]
          volumeMounts:
            - name: html
              mountPath: /html
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: html
          emptyDir: {}
        - name: conf
          configMap:
            name: storefront-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: team-storefront
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: storefront
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-export
  namespace: team-batch
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: batch-export
  template:
    metadata:
      labels:
        tenant: batch
        app.kubernetes.io/name: batch-export
    spec:
      nodeSelector:
        kubernetes.io/hostname: noisy-neighbor-worker
      containers:
        # Four CPU workers and one 384 MiB memory worker that keeps its allocation.
        - name: stress
          image: polinux/stress:1.0.4
          command: ["stress", "--cpu", "4", "--vm", "1", "--vm-bytes", "384M", "--vm-keep"]
          resources:
            requests:
              cpu: "1"
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 512Mi
