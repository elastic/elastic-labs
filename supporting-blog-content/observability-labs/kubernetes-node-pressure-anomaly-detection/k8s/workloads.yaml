# The service that gets evicted: a single-replica NGINX Deployment with no memory request and a
# negative pod priority, pinned to the worker. Every other pod on the worker, including the
# collectors and the two stress pods, keeps the default priority 0, so the kubelet ranks NGINX first
# and then the pod furthest above its memory request.
apiVersion: v1
kind: Namespace
metadata:
  name: pressure-lab
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: pressure-lab-low
value: -10
preemptionPolicy: Never
globalDefault: false
description: Low priority for the disposable service in the node pressure lab.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pressure-web
  namespace: pressure-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pressure-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pressure-web
    spec:
      priorityClassName: pressure-lab-low
      nodeSelector:
        kubernetes.io/hostname: node-pressure-v2-worker
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pressure-web
  namespace: pressure-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: pressure-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
