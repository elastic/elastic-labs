# The fix: select CoreDNS by label, so the rule follows the pods wherever they are scheduled.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-egress
  namespace: shop
spec:
  podSelector:
    matchLabels: {app: checkout}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {app: inventory}
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - ipBlock: {cidr: 172.16.0.0/12}
      ports:
        - {protocol: TCP, port: 4318}
