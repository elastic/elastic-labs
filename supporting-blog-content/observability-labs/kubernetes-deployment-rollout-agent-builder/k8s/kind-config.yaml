# One control plane and three workers (rollout-lab-worker, -worker2, -worker3), so the old and
# new ReplicaSets spread over more than one node and a bad node can be told apart from a bad release.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rollout-lab
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
